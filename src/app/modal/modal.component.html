<div *ngIf="!!openedProject" class="custom-modal" (click)="closeOnBackdropClick($event)">
    <div class="custom-modal-content " (click)="$event.stopPropagation()">
      <div class="custom-modal-header">
        <h5>{{openedProject}}</h5>
        <button type="button" class="btn-close btn-close-white" (click)="closeModal()" aria-label="Close modal"></button>
      </div>
      <div class="custom-modal-body">
        <iframe *ngIf="openedProject === 'Crossword generator'" src="assets/reactBuilds/crossword/index.html" width="100%" height="500px" frameborder="0" title="Crossword Generator Demo"></iframe>
        <iframe *ngIf="openedProject === 'Catch game'" src="assets/reactBuilds/catch-game/index.html" width="100%" height="500px" frameborder="0" title="Catch Game Demo"></iframe>
    </div>
    </div>
  </div>
