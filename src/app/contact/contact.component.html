<div class="contact-container container text-center">
  <h3 class="card-title">My Contact Details</h3>
  <hr>
  <div class="contact-layout">
    <div class="my-contacts">
      <div class="card contact-card">
        <div class="card-body text-center">
          <p class="card-text"><b>Current location:</b> Almaty, Kazakhstan</p>
          <hr>
          <a class="card-link" href="mailto:bekberata@gmail.com" aria-label="Send email to bekberata@gmail.com"><fa-icon [icon]="faMail" size="lg"></fa-icon> bekberata@gmail.com</a>
          <hr>
          <a class="card-link" href="tel:+77776511765" aria-label="Call +7 777 651 17 65"><fa-icon [icon]="faPhone" size="lg"></fa-icon> +7 777 651 17 65</a>
          <hr>
          <p class="card-link"><fa-icon [icon]="faDiscord" size="lg"></fa-icon> ye-russell</p>
          <hr>
          <div class="socials-container mt-3">
            <a class="telegram" href="https://t.me/bye29" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
              <fa-icon [icon]="faTelegram" size="2x"></fa-icon>
            </a>
            <a class="github" href="https://github.com/ye-russell" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
              <fa-icon [icon]="faGithub" size="2x"></fa-icon>
            </a>
            <a class="linkedin" href="https://www.linkedin.com/in/yerassyl-bekberov-5b04371a8/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
              <fa-icon [icon]="faLinkedin" size="2x"></fa-icon>
            </a>
            <a class="facebook" href="https://www.facebook.com/yerassyl.bekberov" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
              <fa-icon [icon]="faFacebook" size="2x"></fa-icon>
            </a>
          </div>
        </div>
      </div>
    </div>
    <div class="contact-form-wrapper">
      <div class="card contact-card">
        <div class="card-body">
          <h5 class="card-title text-center mb-3">Send me a message</h5>
          <form action="https://formspree.io/f/your-form-id" method="POST" class="contact-form">
            <div class="form-group mb-3">
              <label for="name">Name</label>
              <input type="text" class="form-control" id="name" name="name" required placeholder="Your name">
            </div>
            <div class="form-group mb-3">
              <label for="email">Email</label>
              <input type="email" class="form-control" id="email" name="_replyto" required placeholder="your@email.com">
            </div>
            <div class="form-group mb-3">
              <label for="message">Message</label>
              <textarea class="form-control" id="message" name="message" rows="4" required placeholder="Your message..."></textarea>
            </div>
            <button type="submit" class="btn btn-dark w-100">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
